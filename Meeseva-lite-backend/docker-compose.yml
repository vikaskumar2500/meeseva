version: '3.8'
services:
  mongo:
    image: mongo:latest
    container_name: ise_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - ise-network

  api:
    build: .
    container_name: ise_api
    ports:
      - "5000:5000"
    depends_on:
      - mongo
    environment:
      - MONGODB_URI=mongodb://mongo:27017/ise_backend
      - PORT=5000
      - JWT_SECRET=supersecret
      - JWT_EXPIRES_IN=1d
      - NODE_ENV=development
    networks:
      - ise-network

networks:
  ise-network:
    driver: bridge

volumes:
  mongo-data:
    driver: local
